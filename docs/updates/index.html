<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mening ilovalarim yangilanishlari</title><style>body{font:18px system-ui;max-width:660px;margin:12vh auto;padding:24px;background:#10202b;color:white}a{color:#82e4c8}</style><h1>Mening ilovalarim</h1><p id="state">Kompyuterdagi server manzili tekshirilmoqda…</p><a id="open" hidden>Yangilanish serverini ochish</a><script>
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
(async()=>{try{
 const response=await fetch('https://raw.githubusercontent.com/kgofurov-creator/farzonaxon-english/main/server.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error();const envelope=await response.json();
 const key=await crypto.subtle.importKey('spki',bytes('MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAwARz7UOWFRe1a1w3QGtlph3iJ8IaBwJIxIX4iJBHlABJbZejPW1l2QQUME8FnRSVKUfr60S7DwJrRo2csM1wAZ38yMoFKflGLYPylSSJpHmjqvFHhI5J1XhDT5bP9BrhGxwCR2BgPlLe/uqRn4dKoySItvTO4gFXY1G7/iI1Uq9VE6tNogjPnvxGg9JpC7mYEy68UiYM3IFBy61lKVR1m4Dw8kksZuWMTaDFZcxRWGv0XkR5spbv+gOdBIRTDzpT19lC7wMYaqrUFG7yjLhzuqgAetrlJYkeMyszZRwXyvPUE0Nutgselz4po/SIx4+16RH/cOOg+BfAASNJWZOL2wIDAQAB'),{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['verify']);
 if(!await crypto.subtle.verify('RSASSA-PKCS1-v1_5',key,bytes(envelope.signature),bytes(envelope.payload)))throw Error();
 const data=JSON.parse(new TextDecoder().decode(bytes(envelope.payload)));const target=new URL(data.baseUrl);if(target.protocol!=='https:')throw Error();
 document.getElementById('state').textContent='Serverga yo‘naltirilmoqda. Kompyuter va internet yoqilgan bo‘lishi kerak.';
 const link=document.getElementById('open');link.href=target.href;link.hidden=false;location.replace(target.href);
}catch{document.getElementById('state').textContent='Server manzilini tekshirib bo‘lmadi. Keyinroq qayta oching.';}})();
</script></html>
